<div class="st-copilot-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>ST-Copilot</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content" style="padding-top:10px;">
            <!-- A launcher only: every setting lives in Copilot's own Settings window, so there is
                 one place to change each one (a second full copy here drifted from it). -->
            <div class="flex-container flexFlowColumn gap-1">
                <label class="checkbox_label">
                    <input id="scp-enabled" type="checkbox" />
                    <span data-i18n="Enable ST-Copilot">Enable ST-Copilot</span>
                </label>
                <label class="checkbox_label" style="margin-top:6px">
                    <input id="scp-icon-persistent" type="checkbox" />
                    <span data-i18n="Always show floating icon">Always show floating icon</span>
                </label>
                <div style="margin-top:10px; display:flex; gap:6px; flex-wrap:wrap">
                    <button id="scp-open-window" class="menu_button interactable" style="flex:1">
                        <i class="fa-solid fa-robot"></i> <span data-i18n="Open Copilot">Open Copilot</span>
                    </button>
                    <button id="scp-open-settings" class="menu_button interactable" style="flex:1">
                        <i class="fa-solid fa-gear"></i> <span data-i18n="Open Copilot Settings">Open Copilot Settings</span>
                    </button>
                </div>
                <small style="margin-top:6px; opacity:.75" data-i18n="Everything else (connection, prompts, context, memory, tools, appearance) is in Copilot's Settings: the gear button in the Copilot window.">Everything else (connection, prompts, context, memory, tools, appearance) is in Copilot's Settings: the gear button in the Copilot window.</small>
            </div>
        </div>
    </div>
</div>
